name: Trump Post Alerts

on:
  schedule:
    # Every 15 minutes. NOTE: GitHub's scheduled runs are best-effort and can be
    # delayed (often 5-15+ min) during high load, so this is "near" real-time,
    # not instant. See README for the GitHub Actions minutes / cost note.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/trump_alerts.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:    ${{ vars.ANTHROPIC_MODEL }}
          APIFY_TOKEN:        ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID:     ${{ vars.APIFY_ACTOR_ID }}
          APIFY_INPUT_JSON:   ${{ vars.APIFY_INPUT_JSON }}
          LOOKBACK_MINUTES:   ${{ vars.LOOKBACK_MINUTES }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
